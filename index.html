<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeteorRush [MRUSH]</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0b0c10;--p:#14161d;--p2:#1c1f29;--b:#2a2e3b;--t:#e8eaf0;--m:#8b90a3;--a:#ff5a1f;--a2:#ffb400;--ct:#4aa3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,#3a1608 0,transparent 60%),var(--bg);color:var(--t);font:15px/1.45 "Rajdhani","Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:2px solid var(--a);background:#0008;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(6px)}
.logo{font-weight:900;font-size:26px;letter-spacing:2px;font-style:italic}.logo b{color:var(--a)}.logo small{color:var(--m);font-size:13px;letter-spacing:1px;margin-left:6px}
nav{display:flex;gap:6px;margin-left:auto}
#auth,#live{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lv{font-size:12px;font-weight:800;letter-spacing:1px;padding:4px 10px;border:1px solid var(--b);border-radius:20px;color:var(--m)}
.lv.on{color:#fff;border-color:var(--a);background:#3a1a0e}
nav button,.btn{background:var(--p2);color:var(--t);border:1px solid var(--b);padding:8px 14px;border-radius:4px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
nav button.on,.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn:hover,nav button:hover{border-color:var(--a)}.btn.sm{padding:4px 9px;font-size:12px}.btn.red{border-color:#8a2b2b;color:#ff8f8f}
main{max-width:1300px;margin:0 auto;padding:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.chip{padding:6px 14px;border:1px solid var(--b);background:var(--p);border-radius:20px;cursor:pointer;font-weight:700;color:var(--m)}
.chip.on{background:var(--a2);color:#000;border-color:var(--a2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--p);border:1px solid var(--b);border-left:4px solid var(--a);border-radius:6px;padding:14px}
.card.ct{border-left-color:var(--ct)}
.card h3{margin:0 0 4px;font-size:19px}.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:3px;background:var(--a);color:#fff;margin-right:6px}.tag.ct{background:var(--ct)}
.muted{color:var(--m)}
.detail{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:18px}
table{width:100%;border-collapse:collapse;margin-top:12px;display:block;overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--b);vertical-align:top;min-width:110px}
th{color:var(--a2);font-size:12px;text-transform:uppercase;letter-spacing:1px}
td:first-child{font-weight:800;white-space:nowrap}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:4px;background:#000}
.vfb{aspect-ratio:16/9;width:100%;border-radius:4px;background:#000;display:grid;place-items:center;text-align:center;padding:10px;color:var(--m);font-size:13px}
.vfb a{display:inline-block;margin-top:6px;text-decoration:none}
.warn{background:#3a2a08;border:1px solid var(--a2);color:var(--a2);border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px}
input,select,textarea{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:4px;padding:7px 9px;font:inherit;width:100%}
textarea{min-height:60px}
label{display:block;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin:8px 0 3px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.modal.on{display:flex}.modal>div{background:var(--p);border:1px solid var(--a);border-radius:8px;padding:18px;width:min(900px,100%)}
.pl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;padding:8px;background:var(--bg);border-radius:4px}
.pl h4{grid-column:1/-1;margin:0;color:var(--a2)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:linear-gradient(135deg,#34150a,var(--p) 70%);border:1px solid var(--b);border-radius:10px;padding:22px;align-items:center}
.hero h1{margin:6px 0;font-size:36px;font-style:italic;text-transform:uppercase;line-height:1.05}
.novid{aspect-ratio:16/9;display:grid;place-items:center;border:1px dashed var(--b);border-radius:6px;color:var(--m)}
.sec{margin:22px 0 8px;color:var(--a2);text-transform:uppercase;letter-spacing:2px;font-size:13px}
.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.role{background:var(--p);border:1px solid var(--b);border-bottom:4px solid var(--c);color:var(--t);border-radius:8px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.role small{color:var(--m)}.role.on{background:var(--c);color:#000}.role.on small{color:#000}
.ri{font-size:28px}.ri.big{font-size:46px}
.pp{margin-top:12px;background:var(--p);border:1px solid var(--b);border-top:4px solid var(--c);border-radius:8px;padding:18px}
.pph{display:flex;gap:14px;align-items:center}.pph h2{margin:0;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--bg);border-radius:6px;padding:10px;border-left:3px solid var(--c)}.stats small{display:block;color:var(--c);font-weight:800;letter-spacing:1px;margin-bottom:2px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.step{background:var(--bg);border-radius:6px;padding:10px}.step b{display:block;margin-bottom:6px}
.sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#000;font-size:13px;margin-right:6px}
summary{cursor:pointer;color:var(--a2);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:18px}
.tc{display:flex;gap:6px;margin-top:10px;font-size:20px}.tc span{background:var(--bg);border-radius:4px;padding:2px 6px}
.card h3 .mp{color:var(--m);font-size:12px;margin-left:6px}
/* BOARD */
.bd-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bd-top .sp{flex:1}
.bd-wrap{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
.bd-stage{background:linear-gradient(180deg,#12151c,#0c0e13);border:1px solid var(--b);border-radius:10px;padding:12px}
.bd-title{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px;font-weight:900;font-style:italic;font-size:24px;letter-spacing:2px}
.bd-title small{color:var(--a);font-size:12px;letter-spacing:2px;font-style:normal}
#cv{width:100%;aspect-ratio:1;display:block;background:#111;border:1px solid var(--b);border-radius:6px;touch-action:none;cursor:crosshair}
.bd-side{display:flex;flex-direction:column;gap:10px}
.bd-sec{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:10px}
.bd-sec h5{margin:0 0 8px;color:var(--a2);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.bd-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bd-g.c2{grid-template-columns:repeat(2,1fr)}.bd-g.c5{grid-template-columns:repeat(5,1fr)}.bd-g.c6{grid-template-columns:repeat(6,1fr)}
.bt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:6px 2px;background:var(--p2);border:1px solid var(--b);border-radius:6px;color:var(--t);font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.12s}
.bt:hover{border-color:var(--a);background:#222634}
.bt.on{border-color:var(--a);background:linear-gradient(180deg,#4a200f,#2a140b);box-shadow:0 0 0 1px var(--a) inset,0 0 12px #ff5a1f55}
.bt svg{display:block}
.bt.num{min-height:36px;font-size:15px}
.sw{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #0008;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.bd-note{margin:8px 0 0;font-size:12px;color:var(--m)}
@media(max-width:800px){.hero,.stats{grid-template-columns:1fr}.roles{gap:4px}.role small{font-size:10px}.bd-wrap{grid-template-columns:1fr}.pl{grid-template-columns:1fr 1fr}nav{margin-left:0;width:100%}nav button{flex:1;padding:8px 4px}}
</style></head><body>
<header><div class="logo">METEOR<b>RUSH</b><small>[MRUSH]</small></div>
<nav id="nav"><button data-v="playbook">Playbook</button><button data-v="grenades">Grenades</button><button data-v="board">Board IGL</button></nav><div id="live"></div><div id="auth"></div></header>
<div id="sync"></div>
<main id="app"></main>
<div class="modal" id="modal"><div id="mbody"></div></div>
<script>
const MAPS=['mirage','anubis','ancient','nuke'],POS=['Entry','Rifler','Lurk','AWP','IGL'];
/* Hash SHA-256 hasła admina. Domyślne hasło: zmien-haslo */
const ADMIN_HASH='da790c280cbaecbe6a6942287bf17fb8ab37a5d4fdb789ec0131ba9b0d46653e';
/* NAZWA POKOJU LIVE: zmień na własny losowy ciąg (litery, cyfry, myślniki) */
const LIVE_ROOM='mrush-k7f2q9x4w8m3';
let DIRTY=false,NOREMOTE=false;
let ADMIN=false;try{ADMIN=localStorage.getItem('mrush_admin')===ADMIN_HASH}catch(e){}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={tactics:[],nades:[],boards:{},bg:{}},ui={pl:0,v:'playbook',map:'mirage',side:'all',open:null,ntype:'all'};
const defaultTactics=()=>[];
const save=()=>{if(!ADMIN)return;DIRTY=true;renderAuth();try{localStorage.setItem('mrush1',JSON.stringify(S))}catch(e){alert('Brak miejsca w pamięci przeglądarki (może za duży obrazek mapy).')}sendData()};
const $=s=>document.querySelector(s);
const chips=(arr,cur,k,all)=>(all?[['all','Wszystkie']]:[]).concat(arr.map(a=>[a,a.toUpperCase()])).map(([v,l])=>`<span class="chip ${cur===v?'on':''}" onclick="ui.${k}='${v}';render()">${l}</span>`).join('');
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.v));
 ({playbook:rPlay,grenades:rNades,board:rBoard})[ui.v]();
 bcast();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ui.v=b.dataset.v;ui.open=null;render()});
/* ADMIN / DANE */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function login(){const p=prompt('Hasło admina:');if(!p)return;try{if(await sha(p)===ADMIN_HASH){localStorage.setItem('mrush_admin',ADMIN_HASH);location.reload()}else alert('Złe hasło')}catch(e){alert('Logowanie działa tylko przez https lub localhost.')}}
function logout(){try{localStorage.removeItem('mrush_admin')}catch(e){}location.reload()}
function exportData(){const a=document.createElement('a');a.download='data.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.click()}
function fromServer(){if(confirm('Wczytać dane z data.json i nadpisać lokalne zmiany?')){try{localStorage.removeItem('mrush1')}catch(e){}location.reload()}}
function renderAuth(){
 $('#auth').innerHTML=ADMIN
 ?`<button class="btn sm" onclick="exportData()" title="Pobierz data.json i wgraj go do repozytorium GitHub">💾 Eksport data.json</button><button class="btn sm" onclick="fromServer()">⟳ Z serwera</button><button class="btn sm" onclick="logout()">Wyloguj</button>`
 :`<button class="btn sm" onclick="login()">🔒 Admin</button>`;
 $('#sync').innerHTML=ADMIN&&DIRTY
 ?`<div class="warn" style="margin:12px 18px 0">⚠️ Masz zmiany, których nie ma na serwerze (goście widzą je tylko, gdy jesteś online). Kliknij „💾 Eksport data.json" i wgraj plik do repozytorium jako <b>data.json</b>.</div>`
 :(!ADMIN&&NOREMOTE&&!IS_FILE?`<div class="warn" style="margin:12px 18px 0">Nie udało się wczytać danych (data.json) z serwera.</div>`:'');
}
async function init(){
 let remote=null,local=null;
 try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)remote=await r.json()}catch(e){}
 try{const r=localStorage.getItem('mrush1');if(r)local=JSON.parse(r)}catch(e){}
 const base=remote||local||{};
 if(ADMIN&&local){
  S={
   tactics:local.tactics||remote?.tactics||defaultTactics(),
   nades:local.nades||remote?.nades||[],
   boards:local.boards||remote?.boards||{},
   bg:local.bg||remote?.bg||{}
  };
 }else{
  S={
   tactics:base.tactics||defaultTactics(),
   nades:base.nades||[],
   boards:base.boards||{},
   bg:base.bg||{}
  };
 }
 NOREMOTE=!remote;
 DIRTY=ADMIN&&(!remote||['tactics','nades','boards','bg'].some(k=>JSON.stringify(S[k])!==JSON.stringify(remote[k]??(k=='tactics'||k=='nades'?[]:{}))));
 renderAuth();render();liveStart();
}
/* LIVE (WebRTC przez PeerJS): admin jest hostem, reszta tylko ogląda */
let LIVE={peer:null,conns:[],conn:null,connected:false,follow:true,status:'init'};
const liveSnap=()=>({t:'s',ui:{v:ui.v,map:ui.map,open:ui.open,pl:ui.pl,side:ui.side,ntype:ui.ntype},bmap:B.map,objs:B.objs,cur:B.cur,bg:S.bg[ui.map]||null});
const liveData=()=>({t:'d',tactics:S.tactics,nades:S.nades,boards:S.boards,bg:S.bg});
let _bt=0,_bq=null,_last='';
function bcast(){
 if(!ADMIN||!LIVE.conns.length)return;
 const now=Date.now();
 if(now-_bt<60){if(!_bq)_bq=setTimeout(()=>{_bq=null;bcast()},70);return}
 _bt=now;const m=liveSnap(),j=JSON.stringify(m);if(j===_last)return;_last=j;
 LIVE.conns.forEach(c=>{if(c.open)c.send(m)});
}
function sendData(){if(!ADMIN||!LIVE.conns.length)return;const m=liveData();LIVE.conns.forEach(c=>{if(c.open)c.send(m)})}
function liveHost(){
 const p=new Peer(LIVE_ROOM);LIVE.peer=p;
 p.on('open',()=>{LIVE.status='host';renderLive()});
 p.on('error',e=>{LIVE.status=e.type==='unavailable-id'?'dup':'err';renderLive()});
 p.on('connection',c=>{
  const full=()=>{c.send(liveData());c.send(liveSnap())};
  c.on('open',()=>{LIVE.conns.push(c);renderLive();full()});
  c.on('data',m=>{if(m&&m.t==='hello')full()});
  const drop=()=>{LIVE.conns=LIVE.conns.filter(x=>x!==c);renderLive()};
  c.on('close',drop);c.on('error',drop);
 });
}
function liveView(){
 const p=new Peer();LIVE.peer=p;let timer=null;
 const again=()=>{LIVE.connected=false;LIVE.status='wait';renderLive();if(timer)return;timer=setTimeout(()=>{timer=null;go()},5000)};
 const go=()=>{
  if(p.destroyed)return;
  if(p.disconnected){try{p.reconnect()}catch(e){}}
  const c=p.connect(LIVE_ROOM,{reliable:true});
  c.on('open',()=>{LIVE.conn=c;LIVE.connected=true;LIVE.status='view';renderLive();c.send({t:'hello'})});
  c.on('data',liveRecv);
  c.on('close',again);
 };
 p.on('open',go);
 p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
 p.on('error',again);
}
function liveRecv(m){
 if(!m)return;
 if(m.t==='d'){
  if(m.tactics) S.tactics=m.tactics;
  if(m.nades) S.nades=m.nades;
  if(m.boards) S.boards=m.boards;
  if(m.bg){ S.bg=m.bg; if(ui.v==='board') loadBg(); }
  if(LIVE.follow)render();
  return;
 }
 if(m.t==='s'&&LIVE.follow){
  const u=m.ui,ch=['v','map','open','pl','side','ntype'].some(k=>ui[k]!==u[k]);
  const prevMap=ui.map;
  Object.assign(ui,u);
  if(m.bg!==undefined && S.bg[ui.map]!==m.bg){
   if(m.bg) S.bg[ui.map]=m.bg; else delete S.bg[ui.map];
   if(ui.v==='board') loadBg();
  }
  if(ch)render();
  if(m.bmap){
   B.drafts[m.bmap]=m.objs;
   if(B.map===m.bmap&&ui.v==='board'){
    if(prevMap!==m.bmap) loadBg();
    B.objs=m.objs;B.cur=m.cur;B.sel=null;draw();
   }
  }
 }
}
function toggleFollow(){LIVE.follow=!LIVE.follow;renderLive();if(LIVE.follow&&LIVE.conn&&LIVE.connected)LIVE.conn.send({t:'hello'})}
function renderLive(){
 const el=$('#live');if(!el)return;let h='';
 if(LIVE.status==='nolib')h='<span class="lv">⚠️ Live niedostępne (brak biblioteki)</span>';
 else if(ADMIN){
  h=LIVE.status==='host'?`<span class="lv on">🔴 LIVE · widzów: ${LIVE.conns.length}</span>`
   :LIVE.status==='dup'?'<span class="lv">⚠️ Host już działa w innej karcie</span>'
   :LIVE.status==='err'?'<span class="lv">⚠️ Live niedostępne</span>':'<span class="lv">⏳ Łączenie…</span>';
 }else{
  h=LIVE.connected?`<span class="lv on">🟢 Na żywo</span><button class="btn sm" onclick="toggleFollow()">${LIVE.follow?'Śledzę hosta ✓':'Śledź hosta'}</button>`:'<span class="lv">⚪ Host offline</span>';
 }
 el.innerHTML=h;
}
function liveStart(){
 if(typeof Peer==='undefined'){LIVE.status='nolib';renderLive();return}
 renderLive();ADMIN?liveHost():liveView();
}
/* PLAYBOOK */
const ROLES={Entry:['⚔️','#ff5a1f'],Rifler:['🤝','#3ddc84'],Lurk:['🕵️','#a77bff'],AWP:['🎯','#ffb400'],IGL:['🧠','#4aa3ff']};
const ri=p=>ROLES[p]||['👤','#8b90a3'];
const ytid=u=>{u=String(u);let m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(m)return 'yt:'+m[1];m=u.match(/streamable\.com\/(?:[eos]\/)?([a-z0-9]+)/i);return m?'st:'+m[1]:''};
const vlist=s=>String(s||'').split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const p=l.split('|'),url=p.pop().trim();return{title:p.join('|').trim()||'Krok '+(i+1),url,id:ytid(url)}});
const IS_FILE=location.protocol==='file:';
const emb=k=>{const [t,id]=k.split(':');
 if(t==='st')return `<iframe class="vid" loading="lazy" src="https://streamable.com/e/${id}" allow="fullscreen" allowfullscreen></iframe>`;
 if(IS_FILE)return `<div class="vfb"><div>Osadzanie YouTube nie działa przy otwarciu pliku z dysku (file://).<br><a class="btn sm" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${id}">▶ Obejrzyj na YouTube</a></div></div>`;
 return `<iframe class="vid" loading="lazy" src="https://www.youtube-nocookie.com/embed/${id}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`};
const fileWarn=()=>IS_FILE?`<div class="warn">⚠️ Strona jest otwarta z dysku (file://), więc YouTube blokuje osadzone filmy (błąd 153). Filmy ze Streamable działają normalnie. Żeby działał też YouTube, uruchom stronę przez http: w folderze z plikiem wpisz <b>python -m http.server 8000</b> i wejdź na <b>http://localhost:8000</b>, albo wrzuć plik na GitHub Pages / Netlify.</div>`:'';
function rPlay(){
 const a=$('#app');
 const t=ui.open&&(S.tactics||[]).find(x=>x.id===ui.open);
 if(t){
  const p=t.players[ui.pl]||t.players[0],[ic,col]=ri(p.pos),mv=ytid(t.video),steps=vlist(p.vid);
  a.innerHTML=`${fileWarn()}<div class="bar"><button class="btn" onclick="ui.open=null;render()">← Wróć</button><span class="sp"></span>${ADMIN?`<button class="btn" onclick="editT('${t.id}')">Edytuj</button><button class="btn red" onclick="delT('${t.id}')">Usuń</button>`:''}</div>

   x.setLineDash(dash);x.save();x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=w+3;L();x.stroke();x.restore();L();x.stroke();x.setLineDash([]);
   x.save();x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=3;H();x.stroke();x.restore();H();x.fill()}
  else if(o.t=='text'){x.font='bold 32px sans-serif';x.textAlign='left';x.textBaseline='middle';x.lineWidth=6;x.strokeStyle='#000';x.strokeText(o.s,o.x,o.y);x.fillText(o.s,o.x,o.y)}
  else if(o.t=='icon'){
   if(o.k&&ICON[o.k])drawIcon(x,o.k,o.x,o.y,28);
   else{x.font='46px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(o.e||'?',o.x,o.y)}}
  else if(o.t=='pl'){
   x.save();x.shadowColor='rgba(0,0,0,.65)';x.shadowBlur=10;x.fillStyle=o.s=='CT'?'#4aa3ff':'#ff5a1f';x.beginPath();x.arc(o.x,o.y,23,0,7);x.fill();x.restore();
   x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(o.x,o.y,23,0,7);x.stroke();
   x.fillStyle='#fff';x.font='bold 27px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(o.n,o.x,o.y+1)}
  if(o===B.sel){x.strokeStyle='#ffb400';x.lineWidth=2;x.setLineDash([6,4]);const b=bb(o);x.strokeRect(b[0]-6,b[1]-6,b[2]-b[0]+12,b[3]-b[1]+12);x.setLineDash([])}
 });
 bcast();
}
function bb(o){if(o.t=='pen'){const a=o.p.map(q=>q[0]),b=o.p.map(q=>q[1]);return[Math.min(...a),Math.min(...b),Math.max(...a),Math.max(...b)]}
 if(o.t=='arrow')return[Math.min(o.x1,o.x2),Math.min(o.y1,o.y2),Math.max(o.x1,o.x2),Math.max(o.y1,o.y2)];
 if(o.t=='text')return[o.x,o.y-18,o.x+o.s.length*18,o.y+18];return[o.x-28,o.y-28,o.x+28,o.y+28]}
function hit(p){for(let i=B.objs.length-1;i>=0;i--){const b=bb(B.objs[i]);if(p[0]>=b[0]-8&&p[0]<=b[2]+8&&p[1]>=b[1]-8&&p[1]<=b[3]+8)return B.objs[i]}return null}
const pos=e=>{const r=$('#cv').getBoundingClientRect();return[(e.clientX-r.left)*1024/r.width,(e.clientY-r.top)*1024/r.height]};
let drag=null;
function pd(e){
 if(!ADMIN)return;
 snap();const p=pos(e);$('#cv').setPointerCapture(e.pointerId);const t=B.tool;
 if(t!='move')B.sel=null;
 if(t=='pen')B.cur={t:'pen',c:B.color,w:B.size,d:B.dash,p:[p]};
 else if(t=='arrow')B.cur={t:'arrow',c:B.color,w:B.size,d:B.dash,x1:p[0],y1:p[1],x2:p[0],y2:p[1]};
 else if(t=='text'){const s=prompt('Tekst:');if(s)B.objs.push({t:'text',c:B.color,s,x:p[0],y:p[1]})}
 else if(t=='icon'){B.objs.push({t:'icon',k:B.icon,x:p[0],y:p[1]})}
 else if(t=='pl'){B.objs.push({t:'pl',s:B.side,n:B.num,x:p[0],y:p[1]});B.num=B.num%5+1;mark()}
 else if(t=='eraser'){const o=hit(p);if(o)B.objs=B.objs.filter(q=>q!==o)}
 else if(t=='move'){B.sel=hit(p);drag=B.sel?p:null}
 draw()}
function pm(e){const p=pos(e);
 if(B.cur){if(B.cur.t=='pen')B.cur.p.push(p);else{B.cur.x2=p[0];B.cur.y2=p[1]}draw()}
 else if(drag&&B.sel){const dx=p[0]-drag[0],dy=p[1]-drag[1],o=B.sel;drag=p;
  if(o.t=='pen')o.p.forEach(q=>{q[0]+=dx;q[1]+=dy});else if(o.t=='arrow'){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else{o.x+=dx;o.y+=dy}draw()}}
function pu(){if(B.cur){B.objs.push(B.cur);B.cur=null}drag=null;draw()}
document.addEventListener('keydown',e=>{if(!ADMIN||ui.v!='board'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if((e.ctrlKey||e.metaKey)&&e.code=='KeyZ'){e.preventDefault();e.shiftKey?redo():undo()}
 else if((e.ctrlKey||e.metaKey)&&e.code=='KeyY'){e.preventDefault();redo()}
 else if(B.sel&&(e.key=='Delete'||e.key=='Backspace')){snap();B.objs=B.objs.filter(o=>o!==B.sel);B.sel=null;draw()}});
init();
</script></body></html>
